<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra Papel Tesoura</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <p><b>Pedra Papel Tesoura</b></p><br>
    <button onclick="
       playgame('pedra')
    ">Pedra</button>

    <button onclick="
       playgame('papel')
    ">Papel</button>

    <button onclick="
     playgame('tesoura')
    ">Tesoura</button>
    <p class="js-score"></p>

    <button onclick="
    score.wins = 0;
    score.loses = 0;
    score.tie = 0;

    updateScoreElement()

    alert('Pontuação zerada')
    ">Zerar Pontuação</button>
    <script>
      let score = JSON.parse(localStorage.getItem('score'))

      if (score === null) {
        score = {
          wins: 0,
          loses: 0,
          tie: 0
        }
      }

      function updateScoreElement() {
      document.querySelector('.js-score').innerHTML =
      `Vitórias: ${score.wins}, Derrotas: ${score.loses}, Empates ${score.tie}`;
      }

      function playgame(playermove){
        const computermove = pickcomputermove()
        let resultado = '';
        if (playermove === "tesoura") {
          if (computermove === 'Pedra') {
            resultado = 'Você perdeu'
          } else if (computermove === 'Papel') {
            resultado = 'Você ganhou'
          } else if (computermove === 'Tesoura') {
            resultado = 'Empate'
          }
          } else if (playermove === "papel") {
              if (computermove === 'Pedra') {
                resultado = 'Você ganhou'
              } else if (computermove === 'Papel') {
                resultado = 'Empate'
              } else if (computermove === 'Tesoura') {
                resultado = 'Você perdeu'
            }
          } else if (playermove === "pedra") {
            if (computermove === 'Pedra') {
              resultado = 'Empate'
            } else if (computermove === 'Papel') {
              resultado = 'Você perdeu'
            } else if (computermove === 'Tesoura') {
              resultado = 'Você ganhou'
          }
        }
      
        if (resultado === 'Você ganhou') {
          score.wins += 1
        } else if (resultado === 'Você perdeu') {
          score.loses += 1
        } else {
          score.tie += 1
        }
        localStorage.setItem('score', JSON.stringify(score))

        updateScoreElement()

        alert(`Você escolheu ${playermove}. O computador escolheu ${computermove}. ${resultado}.
        Vitórias: ${score.wins}, Derrotas: ${score.loses}, Empates ${score.tie}`)
      }

      let computermove = '';
      function pickcomputermove() {
        const aleatorio = Math.random() 
       if (aleatorio >= 0 && aleatorio < 1/3) {
        computermove = 'Pedra';
       } else if ( aleatorio >= 1/3 && aleatorio < 2/3) {
         computermove = 'Papel';
       } else if (aleatorio >= 2 / 3 && aleatorio < 1) {
         computermove = 'Tesoura';
       }
       return computermove;
      }
      console.log(JSON.stringify(score))


    </script>
</body>
</html>
